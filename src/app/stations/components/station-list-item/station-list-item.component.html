<ion-item button>
  <ion-label>
    <h2>{{ station().name }}</h2>
    <p>{{ address() }}</p>
    <p><app-station-badges [station]="station()" /></p>
    @if (station().chargers.total > 0) {
      <p>{{ station().maxPowerKw }} kW · {{ connectorTypes() }}</p>
    }
  </ion-label>
  <ion-note slot="end">{{ distance() }}</ion-note>
</ion-item>
